<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Curve Glow Gradient -->
    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Drop Shadow for Curve -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#38bdf8" flood-opacity="0.6"/>
    </filter>
    <filter id="omegaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#818cf8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.35"/>

  <!-- Subtle Frequency Grid Lines -->
  <line x1="22" y1="94" x2="106" y2="94" stroke="#334155" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>
  <line x1="22" y1="42" x2="106" y2="42" stroke="#334155" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.4"/>
  <line x1="68" y1="26" x2="68" y2="102" stroke="#334155" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.4"/>

  <!-- Stylized Greek Omega (Ω) in Background -->
  <text x="64" y="82" font-family="'JetBrains Mono', monospace, Inter, sans-serif" font-size="52" font-weight="900" fill="#38bdf8" fill-opacity="0.18" text-anchor="middle" filter="url(#omegaGlow)">Ω</text>

  <!-- Analog Lowpass Filter Response Curve (Flat passband -> Smooth roll-off -> Stopband) -->
  <path d="M 22 42 C 48 42, 58 44, 68 62 C 78 82, 88 94, 106 94" fill="none" stroke="url(#curveGrad)" stroke-width="5.5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Cutoff Frequency (-3dB / Resonance) Glow Dot -->
  <circle cx="68" cy="62" r="5" fill="#f43f5e" stroke="#ffffff" stroke-width="2"/>
  <circle cx="68" cy="62" r="8" fill="none" stroke="#f43f5e" stroke-width="1.5" opacity="0.6"/>
</svg>
